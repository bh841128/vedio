server {
    listen 80;
    server_name grok.windory.xyz;
    # certbot will fill in the HTTPS block; HTTP challenge path:
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name grok.windory.xyz;

    ssl_certificate     /etc/letsencrypt/live/grok.windory.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grok.windory.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    # API reverse proxy to Python backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Media (videos/covers) served by backend too
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # H5 frontend + everything else
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
